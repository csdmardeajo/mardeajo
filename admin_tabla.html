<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel de Control - CSD Mar de Ajó</title>
    <style>
        :root {
            --bg-principal: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --accent-blue: #2563eb;
            --accent-gold: #f59e0b;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-principal);
            color: var(--text-light);
            padding: 12px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--bg-card);
            border-radius: 20px;
            padding: 20px 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Encabezado Deportivo */
        .header {
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .header h1 {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .header h1 span {
            color: var(--accent-gold);
        }

        .header p {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Selector de Fechas */
        .fecha-selector-wrapper {
            background: rgba(15, 23, 42, 0.6);
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .fecha-selector-wrapper label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .fecha-selector-wrapper select {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
        }

        /* Contenedor de Partidos */
        #contenedorPartidos {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .partido-card {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
        }

        .partido-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 6px;
        }

        .match-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr auto;
            align-items: center;
            gap: 8px;
        }

        /* Botón de selección de equipo */
        .equipo-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            width: 100%;
            min-height: 48px;
            text-align: left;
            transition: all 0.2s;
        }

        .equipo-btn:active {
            transform: scale(0.97);
            border-color: var(--accent-blue);
        }

        .equipo-btn img {
            width: 28px;
            height: 28px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .equipo-btn span {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-light);
            line-height: 1.1;
            white-space: normal;
            word-break: break-word;
        }

        /* Marcador inputs */
        .score-box {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--bg-principal);
            padding: 4px 6px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .score-box input[type="number"] {
            width: 36px;
            height: 36px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--accent-gold);
            font-size: 1.1rem;
            font-weight: 800;
            text-align: center;
            outline: none;
        }

        .score-box .vs {
            font-size: 0.7rem;
            font-weight: 900;
            color: var(--text-muted);
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
        }

        /* Barra de Acciones Fija o Integrada */
        .acciones-bar {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 8px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: 800;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-add {
            background: transparent;
            color: var(--accent-green);
            border: 1px dashed var(--accent-green);
        }

        .btn-save {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .status-msg {
            text-align: center;
            font-size: 0.8rem;
            font-weight: 700;
            min-height: 20px;
            padding: 4px;
            border-radius: 6px;
        }

        /* MODAL RESPONSIVE */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 9999;
        }

        @media (min-width: 600px) {
            .modal-overlay {
                align-items: center;
                padding: 20px;
            }
        }

        .modal-card {
            background: var(--bg-card);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 500px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid var(--border-color);
        }

        @media (min-width: 600px) {
            .modal-card {
                border-radius: 20px;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .modal-header h3 {
            font-size: 1rem;
            color: var(--accent-gold);
            text-transform: uppercase;
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .escudos-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            overflow-y: auto;
            padding-right: 4px;
        }

        @media (min-width: 400px) {
            .escudos-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .escudo-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            text-align: center;
        }

        .escudo-card:active:not(.disabled) {
            border-color: var(--accent-blue);
            background: var(--bg-input);
        }

        .escudo-card img {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        .escudo-card span {
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--text-light);
            line-height: 1.1;
        }

        .escudo-card.disabled {
            opacity: 0.2;
            filter: grayscale(100%);
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>CSD <span>MAR DE AJÓ</span></h1>
        <p>Panel Oficial de Control de Posiciones</p>
    </div>

    <div class="fecha-selector-wrapper">
        <label for="selectFecha">Jornada:</label>
        <select id="selectFecha" onchange="cambiarFecha(this.value)"></select>
    </div>

    <div id="contenedorPartidos"></div>

    <div class="acciones-bar" id="barraAcciones">
        <button class="btn btn-add" onclick="agregarPartido()">+ Añadir Enfrentamiento</button>
        <button class="btn btn-save" onclick="guardarFechaActual(true)">💾 Publicar en Sitio Web</button>
    </div>

    <div id="msgStatus" class="status-msg"></div>
</div>

<!-- Modal Selección de Equipos -->
<div class="modal-overlay" id="modalSelector">
    <div class="modal-card">
        <div class="modal-header">
            <h3 id="modalTitle">Seleccionar Club</h3>
            <button class="close-modal" onclick="cerrarModal()">✕</button>
        </div>
        <div class="escudos-grid" id="gridEscudos"></div>
    </div>
</div>

<script>
    const API_ENDPOINT = 'https://csdmardeajo.com.ar/guardar_torneo.php';
    const DATA_ENDPOINT = 'https://csdmardeajo.com.ar/torneo_data.json';
    const placeholderEscudo = "data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%2364748b%22%20stroke-width%3D%222%22%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%2210%22%2F%3E%3C%2Fsvg%3E";

    // Rutas corregidas apuntando a la nueva carpeta /escudos/ subida al repositorio
    const equiposBase = [
        { id: "ALLBOYS", nombre: "ALL BOYS", escudo: "escudos/allboys.png" },
        { id: "CAJU", nombre: "C.A.J.U", escudo: "escudos/caju.png" },
        { id: "COSME", nombre: "COSME ARGERICH", escudo: "escudos/cosme.png" },
        { id: "VILLA", nombre: "DEF. VILLA CLELIA", escudo: "escudos/villa.png" },
        { id: "CADU", nombre: "DEFENSORES UNIDOS", escudo: "escudos/cadu.png" },
        { id: "PORVENIR", nombre: "GRAN PORVENIR", escudo: "escudos/porvenir.png" },
        { id: "FOMENTO", nombre: "FTO. SAN BERNARDO", escudo: "escudos/fomento.png" },
        { id: "QUINTAS", nombre: "LAS QUINTAS", escudo: "escudos/lasquintas.png" },
        { id: "NUCLEO", nombre: "NUCLEO FC", escudo: "escudos/nucleo.png" },
        { id: "LAVALLE", nombre: "POPULAR LAVALLE", escudo: "escudos/lavalle.png" },
        { id: "TONINAS", nombre: "SOC. LAS TONINAS", escudo: "escudos/lastoninas.png" },
        { id: "SOCIAL", nombre: "SOC. MAR DE AJO", escudo: "escudos/social.png" },
        { id: "TUYU", nombre: "SOC. MAR DEL TUYU", escudo: "escudos/mardeltuyu.png" },
        { id: "SANTA", nombre: "SOC. SANTA TERESITA", escudo: "escudos/santa.png" }
    ];

    let fechaActualNum = 0;
    let torneoData = {};
    let partidoActivoContexto = { idMatch: null, rol: null };

    async function cargarDatosRemotos() {
        try {
            const response = await fetch(DATA_ENDPOINT + '?v=' + Date.now());
            if (response.ok) {
                torneoData = await response.json();
            }
        } catch (e) {
            torneoData = JSON.parse(localStorage.getItem('torneo_anual_db')) || {};
        }
        initFechas();
    }

    function obtenerEquipo(id) {
        return equiposBase.find(e => e.id === id);
    }

    function initFechas() {
        const select = document.getElementById('selectFecha');
        select.innerHTML = '';
        select.innerHTML += `<option value="0">Fecha 0 (Inicial)</option>`;
        if (!torneoData[0]) torneoData[0] = [];

        for (let i = 1; i <= 13; i++) {
            select.innerHTML += `<option value="${i}">Fecha ${i}</option>`;
            if (!torneoData[i]) torneoData[i] = [];
        }
        cargarFecha(0);
    }

    function cambiarFecha(nuevaFecha) {
        guardarFechaActual(false);
        fechaActualNum = parseInt(nuevaFecha);
        cargarFecha(fechaActualNum);
    }

    function cargarFecha(num) {
        if (!torneoData[num]) torneoData[num] = [];
        const barra = document.getElementById('barraAcciones');
        barra.style.display = (num === 0) ? 'none' : 'flex';
        renderPartidos();
    }

    function agregarPartido() {
        const idMatch = Date.now();
        torneoData[fechaActualNum].push({ id: idMatch, local: "", visitante: "", gl: 0, gv: 0 });
        renderPartidos();
    }

    function eliminarPartido(idMatch) {
        torneoData[fechaActualNum] = torneoData[fechaActualNum].filter(p => p.id !== idMatch);
        renderPartidos();
    }

    function obtenerEquiposOcupadosEnFechaActual(idMatchActual) {
        let ocupados = [];
        torneoData[fechaActualNum].forEach(p => {
            if (p.id !== idMatchActual) {
                if (p.local) ocupados.push(p.local);
                if (p.visitante) ocupados.push(p.visitante);
            }
        });
        return ocupados;
    }

    function renderPartidos() {
        const div = document.getElementById('contenedorPartidos');
        div.innerHTML = '';

        if (fechaActualNum === 0) {
            div.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding: 30px 10px; font-size:0.85rem;">
                <b>Fecha 0 Seleccionada:</b> La tabla pública muestra las posiciones iniciales. Elegí una Fecha superior para cargar partidos.
            </p>`;
            return;
        }

        const partidos = torneoData[fechaActualNum];
        if (partidos.length === 0) {
            div.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding: 30px 10px; font-size:0.85rem;">No hay partidos en la Fecha ${fechaActualNum}. Tocá en "+ Añadir Enfrentamiento".</p>`;
            return;
        }

        partidos.forEach((p, idx) => {
            const eqLocal = obtenerEquipo(p.local);
            const eqVisita = obtenerEquipo(p.visitante);

            div.innerHTML += `
                <div class="partido-card">
                    <div class="partido-header">
                        <span>PARTIDO ${idx + 1}</span>
                        <button class="btn-delete" onclick="eliminarPartido(${p.id})">✕</button>
                    </div>
                    <div class="match-row">
                        <button class="equipo-btn" onclick="abrirModalSelector(${p.id}, 'local')">
                            <img src="${eqLocal ? eqLocal.escudo : placeholderEscudo}" alt="">
                            <span>${eqLocal ? eqLocal.nombre : 'Elegir Local'}</span>
                        </button>

                        <div class="score-box">
                            <input type="number" pattern="[0-9]*" inputmode="numeric" min="0" value="${p.gl}" onchange="actualizarGoles(${p.id}, 'gl', this.value)">
                            <span class="vs">:</span>
                            <input type="number" pattern="[0-9]*" inputmode="numeric" min="0" value="${p.gv}" onchange="actualizarGoles(${p.id}, 'gv', this.value)">
                        </div>

                        <button class="equipo-btn" onclick="abrirModalSelector(${p.id}, 'visitante')">
                            <img src="${eqVisita ? eqVisita.escudo : placeholderEscudo}" alt="">
                            <span>${eqVisita ? eqVisita.nombre : 'Elegir Visitante'}</span>
                        </button>
                    </div>
                </div>
            `;
        });
    }

    function abrirModalSelector(idMatch, rol) {
        partidoActivoContexto = { idMatch, rol };
        const p = torneoData[fechaActualNum].find(item => item.id === idMatch);
        const ocupados = obtenerEquiposOcupadosEnFechaActual(idMatch);
        const idRival = rol === 'local' ? p.visitante : p.local;

        const grid = document.getElementById('gridEscudos');
        grid.innerHTML = '';
        document.getElementById('modalTitle').innerText = `Elegir ${rol.toUpperCase()}`;

        equiposBase.forEach(eq => {
            const estaDeshabilitado = ocupados.includes(eq.id) || eq.id === idRival;
            const claseDisabled = estaDeshabilitado ? 'disabled' : '';
            const accionClick = estaDeshabilitado ? '' : `onclick="seleccionarEquipoDesdeModal('${eq.id}')"`;

            grid.innerHTML += `
                <div class="escudo-card ${claseDisabled}" ${accionClick}>
                    <img src="${eq.escudo}" alt="${eq.nombre}">
                    <span>${eq.nombre}</span>
                </div>
            `;
        });

        document.getElementById('modalSelector').style.display = 'flex';
    }

    function cerrarModal() {
        document.getElementById('modalSelector').style.display = 'none';
    }

    function seleccionarEquipoDesdeModal(idEquipo) {
        const { idMatch, rol } = partidoActivoContexto;
        const p = torneoData[fechaActualNum].find(item => item.id === idMatch);
        if (p) p[rol] = idEquipo;
        cerrarModal();
        guardarFechaActual(false);
        renderPartidos();
    }

    function actualizarGoles(idMatch, campo, valor) {
        const p = torneoData[fechaActualNum].find(item => item.id === idMatch);
        if (p) p[campo] = parseInt(valor) || 0;
        guardarFechaActual(false);
    }

    async function guardarFechaActual(mostrarMensaje = true) {
        localStorage.setItem('torneo_anual_db', JSON.stringify(torneoData));
        const msg = document.getElementById('msgStatus');

        if (mostrarMensaje) {
            msg.style.color = "var(--accent-gold)";
            msg.innerText = "⏳ Sincronizando con el servidor...";
        }

        try {
            const res = await fetch(API_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(torneoData)
            });

            if (res.ok && mostrarMensaje) {
                msg.style.color = "var(--accent-green)";
                msg.innerText = `¡Fecha ${fechaActualNum} publicada en el sitio oficial!`;
                setTimeout(() => { msg.innerText = ''; }, 3000);
            }
        } catch (err) {
            if (mostrarMensaje) {
                msg.style.color = "var(--accent-red)";
                msg.innerText = "Error de conexión. Se guardó copia en el teléfono.";
            }
        }
    }

    cargarDatosRemotos();
</script>

</body>
</html>
